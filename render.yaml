services:
  - type: web
    name: interviewforge-api
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
    autoDeploy: true
databases:
  - name: interviewforge-db
    dbName: interviewforge
    user: postgres
    region: oregon
